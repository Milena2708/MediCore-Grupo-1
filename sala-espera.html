<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCore — Sala de Espera Activa</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="sala-espera.css">
</head>
<body>

<div class="navbar">
    <h2>⏳ Sala de Espera en Tiempo Real</h2>
    <div class="nav-links">
        <a href="index.html">Dashboard</a>
        <a href="pacientes.html" data-modulo="pacientes">Pacientes</a>
        <a href="citas.html" data-modulo="citas">Citas</a>
        <a href="sala-espera.html" data-modulo="sala-espera">Sala de Espera</a>
        <a href="historial.html" data-modulo="historial">Historial</a>
        <a href="reportes.html" data-modulo="reportes">Reportes</a>
    </div>
    <div class="nav-usuario"><span id="nombreUsuario">...</span></div>
</div>

<div class="container-sala">
    <div class="grid-espera" id="salaContenedor">
        </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="sala-espera.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(async () => {
            await renderSala();
            suscribirSalaEspera(() => { renderSala(); });
        }, 800);
    });

    async function renderSala() {
        const contenedor = document.getElementById('salaContenedor');
        try {
            const data = await obtenerSalaEspera();
            contenedor.innerHTML = data.length === 0 ? '<p>No hay pacientes esperando en este momento.</p>' : '';
            
            data.forEach(reg => {
                const cita = reg.citas;
                const pac = cita.pacientes;
                const colorPrio = cita.prioridad === 'urgente' ? '#D32F2F' : (cita.prioridad === 'preferencial' ? '#F57C00' : '#1976D2');
                
                contenedor.innerHTML += `
                    <div class="tarjeta-espera estado-${reg.estado}">
                        <div class="tarjeta-header">
                            <span class="badge-prioridad" style="background:${colorPrio}">${cita.prioridad.toUpperCase()}</span>
                            <span><strong>${cita.codigo}</strong></span>
                        </div>
                        <h3>${pac.apellidos}, ${pac.nombres}</h3>
                        <p><strong>Especialidad:</strong> ${cita.especialidad} (${cita.medico})</p>
                        <p><strong>Motivo:</strong> ${cita.motivo}</p>
                        
                        <div class="tarjeta-acciones">
                            ${reg.estado === 'en_espera' ? `
                                <button class="btn-atencion" onclick="cambiarAtencion('${reg.id}','${cita.id}')">Llamar a Consultorio</button>
                            ` : `
                                <button class="btn-finalizar" onclick="finalizarAtencion('${reg.id}','${cita.id}')">Atendido / Salida</button>
                            `}
                        </div>
                    </div>
                `;
            });
        } catch(e) { console.error(e); }
    }

    async function cambiarAtencion(salaId, citaId) {
        await avanzarEstado(salaId, citaId, 'en_atencion');
        await renderSala();
    }

    async function finalizarAtencion(salaId, citaId) {
        await avanzarEstado(salaId, citaId, 'atendido');
        await renderSala();
    }
</script>
</body>
</html>
