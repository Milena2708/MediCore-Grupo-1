<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCore — Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="body-login">

<div class="login-container">
    <div class="login-header">
        <h1>🏥 MediCore</h1>
        <p>Gestión Hospitalaria</p>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="form-group">
        <label for="correo">Correo Institucional</label>
        <input type="email" id="correo" placeholder="usuario@medicore.pe">
    </div>

    <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••">
    </div>

    <button class="btn-login" id="btnLogin" onclick="ejecutarLogin()">Iniciar Sesión</button>

    <div class="register-link">
        ¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
    async function verificarSesionActiva() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) window.location.href = 'index.html';
    }
    verificarSesionActiva();

    async function ejecutarLogin() {
        const correo = document.getElementById('correo').value.trim();
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');
        const btn = document.getElementById('btnLogin');

        errorMsg.style.display = 'none';

        if (!correo || !password) {
            errorMsg.textContent = 'Por favor, completa todos los campos.';
            errorMsg.style.display = 'block';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Autenticando...';

        const { data, error } = await supabase.auth.signInWithPassword({
            email: correo,
            password: password
        });

        if (error) {
            errorMsg.textContent = 'Credenciales inválidas. Inténtalo de nuevo.';
            errorMsg.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Iniciar Sesión';
            return;
        }

        window.location.href = 'index.html';
    }
</script>
</body>
</html>
