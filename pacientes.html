<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCore — Módulo Pacientes</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="pacientes.css">
</head>
<body>

<div class="navbar">
    <h2>🏥 MediCore</h2>
    <div class="nav-links">
        <a href="index.html">Dashboard</a>
        <a href="pacientes.html" data-modulo="pacientes">Pacientes</a>
        <a href="citas.html" data-modulo="citas">Citas</a>
        <a href="sala-espera.html" data-modulo="sala-espera">Sala de Espera</a>
        <a href="historial.html" data-modulo="historial">Historial</a>
        <a href="reportes.html" data-modulo="reportes">Reportes</a>
    </div>
    <div class="nav-usuario">
        <span id="nombreUsuario">Cargando...</span>
        <button onclick="cerrarSesion()" class="btn-logout-header">Salir</button>
    </div>
</div>

<div class="container-pacientes">
    <div class="form-section">
        <h3>Formulario de Admisión</h3>
        <form id="formPaciente" onsubmit="guardarFormulario(event)">
            <input type="hidden" id="idEdicion">
            <div class="form-grid">
                <div>
                    <label>Código Paciente</label>
                    <input type="text" id="codigoPaciente" readonly class="input-readonly">
                </div>
                <div>
                    <label>Nombres *</label>
                    <input type="text" id="nombres" required>
                </div>
                <div>
                    <label>Apellidos *</label>
                    <input type="text" id="apellidos" required>
                </div>
                <div>
                    <label>Tipo Documento</label>
                    <select id="tipoDocumento">
                        <option value="DNI">DNI</option>
                        <option value="Pasaporte">Pasaporte</option>
                    </select>
                </div>
                <div>
                    <label>Nro. Documento *</label>
                    <input type="text" id="documento" required>
                </div>
                <div>
                    <label>Fecha Nacimiento *</label>
                    <input type="date" id="fechaNacimiento" required>
                </div>
                <div>
                    <label>Teléfono *</label>
                    <input type="text" id="telefono" required>
                </div>
                <div>
                    <label>Correo Electrónico</label>
                    <input type="email" id="correo">
                </div>
                <div class="form-group-full">
                    <label>Dirección de Residencia</label>
                    <input type="text" id="direccion">
                </div>
                <div>
                    <label>Contacto de Emergencia</label>
                    <input type="text" id="contactoNombre" placeholder="Nombre completo" required>
                </div>
                <div>
                    <label>Parentesco</label>
                    <select id="contactoParentesco">
                        <option value="Familiar">Familiar</option>
                        <option value="Cónyuge">Cónyuge</option>
                        <option value="Otros">Otros</option>
                    </select>
                </div>
                <div>
                    <label>Teléfono Emergencia</label>
                    <input type="text" id="contactoTelefono" required>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-add" id="btnGuardarPaciente">Guardar Paciente</button>
            </div>
        </form>
    </div>

    <div class="action-bar">
        <input type="text" class="search-box" id="txtBuscar" placeholder="Buscar por Nombre, Apellido o DNI..." oninput="cargarTablaPacientes(this.value)">
    </div>

    <table class="main-table">
        <thead>
            <tr>
                <th>Código</th>
                <th>Paciente</th>
                <th>Documento</th>
                <th>Teléfono</th>
                <th>Alergias</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tablaPacientes">
            </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="pacientes.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(async () => {
            await cargarTablaPacientes();
            document.getElementById('codigoPaciente').value = await generarCodigoPaciente();
        }, 800);
    });

    async function guardarFormulario(e) {
        e.preventDefault();
        const datos = {
            codigo: document.getElementById('codigoPaciente').value,
            nombres: document.getElementById('nombres').value,
            apellidos: document.getElementById('apellidos').value,
            tipo_documento: document.getElementById('tipoDocumento').value,
            documento: document.getElementById('documento').value,
            fecha_nacimiento: document.getElementById('fechaNacimiento').value,
            telefono: document.getElementById('telefono').value,
            correo: document.getElementById('correo').value,
            direccion: document.getElementById('direccion').value,
            alergias: [],
            contacto_nombre: document.getElementById('contactoNombre').value,
            contacto_parentesco: document.getElementById('contactoParentesco').value,
            contacto_telefono: document.getElementById('contactoTelefono').value
        };

        try {
            const idEdicion = document.getElementById('idEdicion').value;
            if (idEdicion) {
                await actualizarPaciente(idEdicion, datos);
            } else {
                await crearPaciente(datos);
            }
            document.getElementById('formPaciente').reset();
            document.getElementById('idEdicion').value = '';
            await cargarTablaPacientes();
            document.getElementById('codigoPaciente').value = await generarCodigoPaciente();
        } catch (err) {
            alert(err.message);
        }
    }

    async function editarPaciente(id) {
        const p = await supabase.from('pacientes').select('*').eq('id', id).single();
        if(p.data) {
            document.getElementById('idEdicion').value = p.data.id;
            document.getElementById('codigoPaciente').value = p.data.codigo;
            document.getElementById('nombres').value = p.data.nombres;
            document.getElementById('apellidos').value = p.data.apellidos;
            document.getElementById('tipoDocumento').value = p.data.tipo_documento;
            document.getElementById('documento').value = p.data.documento;
            document.getElementById('fechaNacimiento').value = p.data.fecha_nacimiento;
            document.getElementById('telefono').value = p.data.telefono;
            document.getElementById('correo').value = p.data.correo;
            document.getElementById('direccion').value = p.data.direccion;
            document.getElementById('contactoNombre').value = p.data.contacto_emergencia_nombre;
            document.getElementById('contactoParentesco').value = p.data.contacto_emergencia_parentesco;
            document.getElementById('contactoTelefono').value = p.data.contacto_emergencia_telefono;
        }
    }
</script>
</body>
</html>
