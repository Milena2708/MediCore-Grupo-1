<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCore — Agenda de Citas</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="citas.css">
</head>
<body>

<div class="navbar">
    <h2>🏥 MediCore — Agenda</h2>
    <div class="nav-links">
        <a href="index.html">Dashboard</a>
        <a href="pacientes.html" data-modulo="pacientes">Pacientes</a>
        <a href="citas.html" data-modulo="citas">Citas</a>
        <a href="sala-espera.html" data-modulo="sala-espera">Sala de Espera</a>
        <a href="historial.html" data-modulo="historial">Historial</a>
        <a href="reportes.html" data-modulo="reportes">Reportes</a>
    </div>
    <div class="nav-usuario"><span id="nombreUsuario">...</span></div>
</div>

<div class="container-citas">
    <div class="form-section">
        <h3>Programar Nueva Cita</h3>
        <form id="formCita" onsubmit="guardarCitaForm(event)">
            <div class="form-grid">
                <div>
                    <label>Paciente</label>
                    <select id="selectPaciente" required></select>
                </div>
                <div>
                    <label>Especialidad</label>
                    <select id="especialidad" required>
                        <option value="Medicina General">Medicina General</option>
                        <option value="Pediatría">Pediatría</option>
                        <option value="Cardiología">Cardiología</option>
                    </select>
                </div>
                <div>
                    <label>Médico Especialista</label>
                    <select id="medico" required>
                        <option value="Dr. Juan Arrieta">Dr. Juan Arrieta</option>
                        <option value="Dra. Elena Ramos">Dra. Elena Ramos</option>
                    </select>
                </div>
                <div>
                    <label>Fecha de Cita</label>
                    <input type="date" id="fecha" required>
                </div>
                <div>
                    <label>Horario</label>
                    <input type="time" id="hora" required>
                </div>
                <div>
                    <label>Prioridad</label>
                    <select id="prioridad">
                        <option value="normal">Normal</option>
                        <option value="preferencial">Preferencial</option>
                        <option value="urgente">Urgente</option>
                    </select>
                </div>
                <div class="form-group-full">
                    <label>Motivo de Consulta</label>
                    <textarea id="motivo" rows="2" required></textarea>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-submit">Programar Cita</button>
            </div>
        </form>
    </div>

    <h3>Listado de Citas Programadas</h3>
    <div class="citas-list" id="contenedorCitas"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="citas.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(async () => {
            await cargarSelectPacientes();
            await listarCitas();
        }, 800);
    });

    async function guardarCitaForm(e) {
        e.preventDefault();
        const num = Math.floor(Math.random() * 900) + 100;
        const datos = {
            codigo: `CITA-${num}`,
            paciente_id: document.getElementById('selectPaciente').value,
            especialidad: document.getElementById('especialidad').value,
            medico: document.getElementById('medico').value,
            fecha: document.getElementById('fecha').value,
            hora: document.getElementById('hora').value,
            prioridad: document.getElementById('prioridad').value,
            motivo: document.getElementById('motivo').value
        };

        try {
            await crearCita(datos);
            document.getElementById('formCita').reset();
            await listarCitas();
        } catch (err) { alert(err.message); }
    }

    async function listarCitas() {
        const contenedor = document.getElementById('contenedorCitas');
        const { data: citas } = await supabase.from('citas').select('*, pacientes(*)').eq('estado','programada');
        
        contenedor.innerHTML = citas?.length === 0 ? '<p>No hay citas programadas.</p>' : '';
        citas?.forEach(c => {
            contenedor.innerHTML += `
                <div class="cita-card">
                    <h4>${c.pacientes.apellidos}, ${c.pacientes.nombres}</h4>
                    <p><strong>Especialidad:</strong> ${c.especialidad}</p>
                    <p><strong>Médico:</strong> ${c.medico}</p>
                    <p><strong>Fecha/Hora:</strong> ${c.fecha} @ ${c.hora}</p>
                    <span class="badge-prioridad-lbl">${c.prioridad.toUpperCase()}</span>
                    <br>
                    <button class="btn-status" onclick="admitirSala('${c.id}')">Enviar a Espera</button>
                </div>
            `;
        });
    }

    async function admitirSala(id) {
        try {
            await enviarASalaDeEspera(id);
            await listarCitas();
        } catch(err) { alert(err.message); }
    }
</script>
</body>
</html>
