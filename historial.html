<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCore — Historial Clínico</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="historial.css">
</head>
<body>

<div class="navbar">
    <h2>📋 Módulo de Evolución e Historial Médico</h2>
    <div class="nav-links">
        <a href="index.html">Dashboard</a>
        <a href="pacientes.html" data-modulo="pacientes">Pacientes</a>
        <a href="citas.html" data-modulo="citas">Citas</a>
        <a href="sala-espera.html" data-modulo="sala-espera">Sala de Espera</a>
        <a href="historial.html" data-modulo="historial">Historial</a>
        <a href="reportes.html" data-modulo="reportes">Reportes</a>
    </div>
    <div class="nav-usuario"><span id="nombreUsuario">...</span></div>
</div>

<div class="container-historial">
    <div class="card-historial">
        <h3>Registrar Atención Médica</h3>
        <form id="formHistorial" onsubmit="guardarHistorialForm(event)">
            <div class="form-row-dual">
                <div>
                    <label>Seleccionar Cita Médica Concluida</label>
                    <select id="selectCita" required onchange="vincularPacienteCita()"></select>
                </div>
                <div>
                    <label>ID Paciente</label>
                    <input type="text" id="pacienteId" readonly class="input-disabled">
                </div>
            </div>
            <div class="form-row-single">
                <label>Síntomas Reportados</label>
                <textarea id="sintomas" rows="2" required></textarea>
            </div>
            <div class="form-row-single">
                <label>Diagnóstico General</label>
                <textarea id="diagnostico" rows="2" required></textarea>
            </div>
            <div class="form-row-single">
                <label>Tratamiento Prescrito</label>
                <textarea id="tratamiento" rows="2" required></textarea>
            </div>
            <button type="submit" class="btn-guardar-historial">Guardar Ficha de Atención</button>
        </form>
    </div>

    <div class="card-historial">
        <h3>Consultar Historial Clínico</h3>
        <div class="search-area">
            <input type="text" id="txtBuscarHistorial" placeholder="Ingresa Nombre, Apellido o DNI...">
            <button class="btn-buscar-historial" onclick="ejecutarBusquedaHistorial()">Buscar</button>
        </div>
        <div id="resultadosHistorial"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="historial.js"></script>
<script>
    let citasGlobales = [];

    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(async () => {
            await cargarCitasAtendidas();
        }, 800);
    });

    async function cargarCitasAtendidas() {
        const select = document.getElementById('selectCita');
        const { data } = await supabase.from('citas').select('*, pacientes(*)').eq('estado', 'atendida');
        citasGlobales = data || [];
        
        select.innerHTML = '<option value="">— Selecciona la consulta —</option>';
        citasGlobales.forEach(c => {
            select.innerHTML += `<option value="${c.id}">${c.codigo} -> ${c.pacientes.apellidos} (${c.especialidad})</option>`;
        });
    }

    function vincularPacienteCita() {
        const idCita = document.getElementById('selectCita').value;
        const encontrada = citasGlobales.find(c => c.id === idCita);
        document.getElementById('pacienteId').value = encontrada ? encontrada.pacientes.id : '';
    }

    async function guardarHistorialForm(e) {
        e.preventDefault();
        const idCita = document.getElementById('selectCita').value;
        const encontrada = citasGlobales.find(c => c.id === idCita);

        const datos = {
            paciente_id: document.getElementById('pacienteId').value,
            cita_id: idCita,
            medico: encontrada.medico,
            especialidad: encontrada.especialidad,
            sintomas: document.getElementById('sintomas').value,
            diagnostico: document.getElementById('diagnostico').value,
            tratamiento: document.getElementById('tratamiento').value
        };

        try {
            await crearHistorial(datos);
            await supabase.from('citas').update({ estado: 'atendida' }).eq('id', idCita);
            document.getElementById('formHistorial').reset();
            await cargarCitasAtendidas();
            alert('Atención registrada correctamente.');
        } catch(err) { alert(err.message); }
    }

    async function ejecutarBusquedaHistorial() {
        const txt = document.getElementById('txtBuscarHistorial').value.trim();
        const contenedor = document.getElementById('resultadosHistorial');
        if(!txt) return;

        try {
            const data = await buscarHistorialPaciente(txt);
            contenedor.innerHTML = data.length === 0 ? '<p>No se encontraron registros clínicos.</p>' : '';
            
            data.forEach(h => {
                contenedor.innerHTML += `
                    <div class="historial-item">
                        <h4>Atención: ${h.especialidad} — ${h.medico}</h4>
                        <p><strong>Paciente:</strong> ${h.pacientes.nombres} ${h.pacientes.apellidos}</p>
                        <p><strong>Síntomas:</strong> ${h.sintomas}</p>
                        <p><strong>Diagnóstico:</strong> ${h.diagnostico}</p>
                        <p><strong>Tratamiento:</strong> ${h.tratamiento}</p>
                        <small style="color:#777">Fecha Registro: ${new Date(h.fecha_creacion).toLocaleDateString()}</small>
                    </div>
                `;
            });
        } catch(err) { alert(err.message); }
    }
</script>
</body>
</html>
